name: JHunt Scraper

on:
  schedule:
    - cron: "0 1 * * *"   # Runs daily at 01:00 UTC (08:00 AM Bangkok / Thailand time)
  workflow_dispatch:        # Allows manual trigger from GitHub UI for testing

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true    # ← opts into Node.js 24 now

# One pipeline at a time: overlapping runs restore the same state cache and the
# last save wins. A newer run cancels the older one.
concurrency:
  group: scraper-cron-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. Checkout code ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Restore seen_jobs.json from cache ──────────────────────
      # Cache entries are immutable, so the save step below writes a NEW key on
      # every run (keyed by run_id) and this step prefix-matches the most recent
      # one via restore-keys. A fixed key would freeze state after the first run.
      - name: Restore job state cache
        uses: actions/cache/restore@v4
        with:
          path: data/seen_jobs.json
          key: seen-jobs-state-v2-${{ github.run_id }}
          restore-keys: |
            seen-jobs-state-v2-

      # ── 3. Initialize seen_jobs.json if cache miss ─────────────────
      - name: Initialize state file if missing
        run: |
          mkdir -p data
          [ -f data/seen_jobs.json ] || echo '{"version": 2, "seen": {}}' > data/seen_jobs.json

      # ── 4. Set up uv and Python ───────────────────────────────────
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "requirements.txt"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -r requirements.txt

      # ── 5. Gate on the unit tests ─────────────────────────────────
      # Runs without secrets: every external client is mocked or disabled.
      - name: Run Unit Tests
        run: uv run python -m unittest discover tests

      # ── 6. Run the scraper & intelligence pipeline ────────────────
      # Runs complete end-to-end pipeline: scrape -> store -> extract -> alert -> analyze -> export
      # Ingests directly into Turso cloud (Single Source of Truth) via HTTPS.
      # --limit 30: batch extraction sends 15 jobs per request, so this is 2 Gemini calls.
      - name: Run JHunt pipeline
        env:
          PYTHONUNBUFFERED: "1"
          JHUNT_REQUIRE_TURSO: "1"
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEARCH_KEYWORDS: ${{ secrets.SEARCH_KEYWORDS }}
          TITLE_FILTER: ${{ secrets.TITLE_FILTER }}
          GEMINI_ENABLED: ${{ secrets.GEMINI_ENABLED }}
        run: uv run python main.py run --all --limit 30

      # ── 7. Save updated state back to cache ───────────────────────
      - name: Save job state cache
        if: always()    # Save even if scraper partially fails
        uses: actions/cache/save@v4
        with:
          path: data/seen_jobs.json
          key: seen-jobs-state-v2-${{ github.run_id }}

      # ── 8. Revalidate Dashboard ISR Cache ─────────────────────────
      - name: Revalidate Dashboard ISR Cache
        if: success()
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          REVALIDATE_TOKEN: ${{ secrets.REVALIDATE_TOKEN }}
        run: |
          if [ -n "$SITE_URL" ] && [ -n "$REVALIDATE_TOKEN" ]; then
            echo "Triggering on-demand ISR cache revalidation at $SITE_URL..."
            curl -fsS -X POST -H "x-revalidate-token: $REVALIDATE_TOKEN" "$SITE_URL/api/revalidate" || echo "Warning: Revalidation webhook call failed non-fatally."
          else
            echo "Skipping cache revalidation: SITE_URL or REVALIDATE_TOKEN not configured."
          fi
