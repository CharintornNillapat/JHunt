name: JHunt Scraper

on:
  schedule:
    - cron: "0 2 * * *"   # Runs daily at 02:00 UTC (09:00 Bangkok time)
  workflow_dispatch:        # Allows manual trigger from GitHub UI for testing

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true    # ← opts into Node.js 24 now

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Restore seen_jobs.json from cache ──────────────────────
      # Cache entries are immutable, so the save step below writes a NEW key on
      # every run (keyed by run_id) and this step prefix-matches the most recent
      # one via restore-keys. A fixed key would freeze state after the first run.
      - name: Restore job state cache
        uses: actions/cache/restore@v4
        with:
          path: data/seen_jobs.json
          key: seen-jobs-state-v2-${{ github.run_id }}
          restore-keys: |
            seen-jobs-state-v2-

      # ── 3. Initialize seen_jobs.json if cache miss ─────────────────
      - name: Initialize state file if missing
        run: |
          mkdir -p data
          [ -f data/seen_jobs.json ] || echo '{"version": 2, "seen": {}}' > data/seen_jobs.json

      # ── 4. Set up Miniconda with our environment.yml ───────────────
      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: jhunt
          environment-file: environment.yml
          auto-activate-base: true

      # ── 5. Run the scraper ─────────────────────────────────────────
      # No browser needed: the scraper talks to the JobsDB JSON API directly.
      - name: Run JHunt scraper
        shell: bash -el {0}    # Required: activates conda env properly
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEARCH_KEYWORDS: ${{ secrets.SEARCH_KEYWORDS }}
          TITLE_FILTER: ${{ secrets.TITLE_FILTER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_ENABLED: ${{ secrets.GEMINI_ENABLED }}
        run: python main.py

      # ── 6. Save updated state back to cache ───────────────────────
      - name: Save job state cache
        if: always()    # Save even if scraper partially fails
        uses: actions/cache/save@v4
        with:
          path: data/seen_jobs.json
          key: seen-jobs-state-v2-${{ github.run_id }}
